service:
  type: LoadBalancer

  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

  externalTrafficPolicy: Local

providers:
  kubernetesIngress:
    enabled: true

  kubernetesCRD:
    enabled: true

ports:
  web:
    redirectTo:
      port: websecure

  websecure:
    tls:
      enabled: true
