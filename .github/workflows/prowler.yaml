name: Prowler EKS Scan

on:
  workflow_dispatch:
    inputs:
      severity:
        description: 'Severity levels to scan for'
        required: false
        default: 'critical high medium'
        type: string

permissions:
  contents: read

env:
  CLUSTER_NAME: k8-cluster
  CLUSTER_REGION: ap-south-1

jobs:
  scan:
    name: Prowler EKS scan
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_EKS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_EKS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1

    steps:
      - name: Install Prowler
        run: pipx install prowler

      - name: Show clusters visible to these credentials
        run: |
          echo "EKS clusters in $CLUSTER_REGION:"
          aws eks list-clusters --region "$CLUSTER_REGION"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region "$CLUSTER_REGION" \
            --alias "$CLUSTER_NAME"

      - name: Verify cluster connectivity
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Run Prowler Kubernetes scan
        env:
          SEVERITY: ${{ inputs.severity }}
        run: |
          # --ignore-exit-code-3: prowler exits 3 when it finds failing checks,
          # which would otherwise abort the job before the summary step runs.
          prowler kubernetes \
            --kubeconfig-file ~/.kube/config \
            --context "$CLUSTER_NAME" \
            --severity $SEVERITY \
            --ignore-exit-code-3 \
            --output-formats csv html \
            --output-directory ./output

      - name: Write findings to run summary
        if: always()
        run: |
          python3 << 'PYEOF'
          import csv, glob, os
          from collections import Counter

          ORDER = {"critical": 0, "high": 1, "medium": 2, "low": 3, "informational": 4}
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          files = glob.glob("output/*.csv")

          with open(summary, "a") as out:
              if not files:
                  out.write("## EKS scan\n\nNo report generated — check the scan step logs above.\n")
                  raise SystemExit(0)

              fails = []
              passed = 0
              with open(files[0], newline="", encoding="utf-8") as f:
                  for row in csv.DictReader(f, delimiter=";"):
                      if row["STATUS"] == "FAIL":
                          fails.append(row)
                      elif row["STATUS"] == "PASS":
                          passed += 1

              fails.sort(key=lambda r: ORDER.get(r["SEVERITY"].lower(), 9))
              counts = Counter(r["SEVERITY"].lower() for r in fails)

              out.write(f"## EKS cluster: {os.environ['CLUSTER_NAME']}\n\n")
              out.write(f"**{len(fails)} issues found** ({passed} checks passed)\n\n")

              if counts:
                  parts = [f"{counts[s]} {s}" for s in ORDER if counts.get(s)]
                  out.write(" · ".join(parts) + "\n\n")

              if not fails:
                  out.write("No failing checks at the selected severity levels.\n")
                  raise SystemExit(0)

              out.write("| # | Severity | Issue | Affected resource |\n")
              out.write("|---|---|---|---|\n")
              for i, r in enumerate(fails, 1):
                  sev = r["SEVERITY"].upper()
                  title = r["CHECK_TITLE"].replace("|", "-").strip()
                  res = (r["RESOURCE_NAME"] or r["RESOURCE_UID"]).replace("|", "-").strip()
                  if len(res) > 70:
                      res = res[:67] + "..."
                  out.write(f"| {i} | {sev} | {title} | `{res}` |\n")

              out.write("\n<details><summary>Why each issue matters &amp; how to fix</summary>\n\n")
              for i, r in enumerate(fails, 1):
                  out.write(f"**{i}. {r['CHECK_TITLE'].strip()}** — `{r['SEVERITY'].upper()}`\n\n")
                  if r.get("RISK"):
                      out.write(f"- Risk: {r['RISK'].strip()}\n")
                  fix = r.get("REMEDIATION_RECOMMENDATION_TEXT", "").strip()
                  if fix:
                      out.write(f"- Fix: {fix}\n")
                  if r.get("STATUS_EXTENDED"):
                      out.write(f"- Detail: {r['STATUS_EXTENDED'].strip()}\n")
                  out.write("\n")
              out.write("</details>\n")
          PYEOF

      - name: Upload full report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prowler-eks-report
          path: ./output/
          if-no-files-found: warn
          retention-days: 30
